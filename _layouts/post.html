---
layout: default
---

<article class="wrap" style="padding-top: 44px">
  <div class="kicker">
    {{ page.date | date: "%B %-d, %Y" }}
    {%- if page.tags.size > 0 %} &middot; {{ page.tags | join: " &middot; " }}{% endif -%}
  </div>

  <h1 class="page-title">{{ page.title }}</h1>
  {%- if page.summary %}<p class="lede">{{ page.summary }}</p>{% endif -%}

  <div class="prose">
    {{ content }}
  </div>

  <p class="meta" style="margin-top: 40px">
    <a href="{{ '/writing/' | relative_url }}">&larr; All posts</a>
  </p>
</article>
